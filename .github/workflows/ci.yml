name: CI

on:
  push:
    branches: [main, codex/ios-companion]
  pull_request:
    branches: [main, codex/ios-companion]

permissions:
  contents: read

jobs:
  build:
    name: Build (Swift 6, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build -v

      - name: Test macOS app
        run: swift test

      - name: Test shared sync layer
        run: swift test --package-path Shared

      - name: Build app bundle
        run: VERSION=0.0.0 BUILD=ci ./scripts/build_app.sh

      - name: Verify distribution signing remains local
        run: |
          set -euo pipefail
          test -x scripts/local_release.sh
          tracked_signing_assets="$(
            git ls-files | grep -E '(^|/)\.local-release\.env$|\.(p12|p8|provisionprofile|mobileprovision)$' || true
          )"
          if [[ -n "$tracked_signing_assets" ]]; then
            echo "::error::Signing assets must not be committed:"
            echo "$tracked_signing_assets"
            exit 1
          fi

          test ! -e packaging/Pesty.app/Contents/embedded.provisionprofile
          if codesign --verify --deep --strict packaging/Pesty.app >/dev/null 2>&1; then
            echo "::error::CI app bundle unexpectedly has a distribution signature."
            exit 1
          fi
          echo "CI bundle is unsigned for distribution; CloudKit signing is local-only."
