name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - .release-version

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(tr -d '[:space:]' < .release-version)"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect signing credentials
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERT_P12_BASE64" && -n "$MACOS_CERT_PASSWORD" \
             && -n "$KEYCHAIN_PASSWORD" && -n "$SIGN_IDENTITY" \
             && -n "$ASC_KEY_P8_BASE64" && -n "$ASC_KEY_ID" \
             && -n "$ASC_ISSUER_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f /tmp/cert.p12

      - name: Write App Store Connect API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build, sign, and notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ./scripts/release_build.sh

      - name: Build ad-hoc signed package
        if: steps.signing.outputs.enabled != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: ./scripts/build_unsigned_release.sh

      - name: Compute checksum and notes
        id: sum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          dmg="packaging/Pesty-$VERSION.dmg"
          sha256="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

          if [[ "$SIGNED" == "true" ]]; then
            trust_note="Signed with Developer ID and notarized by Apple."
          else
            trust_note="Ad-hoc signed build. This fork has no Developer ID/notarization secrets, so macOS may require Control-click > Open on first launch."
          fi

          cat > /tmp/release-notes.md <<EOF
          Pesty $VERSION fixes opening the paste bar from any macOS Space.

          SHA-256: \`$sha256\`

          $trust_note
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          DMG: ${{ steps.sum.outputs.dmg }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$DMG" --clobber
            gh release edit "$tag" --title "Pesty $VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "$tag" "$DMG" \
              --target "$GITHUB_SHA" \
              --title "Pesty $VERSION" \
              --notes-file /tmp/release-notes.md
          fi
